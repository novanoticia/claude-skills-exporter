name: Mistral PR Review

on:
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened, edited]

# Un push nuevo cancela la revision anterior del mismo PR.
concurrency:
  group: mistral-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # El revisor vive en novanoticia/mistral-review; aqui solo se llama.
  mistral-review:
    permissions:
      pull-requests: write
      contents: read
    uses: novanoticia/mistral-review/.github/workflows/review.yml@v1.3
    with:
      # Debe coincidir con la etiqueta de `uses:` (version fija de mistral-review).
      ref: v1.3
      # Proveedor: MISTRAL_PROVIDER vacio o `mistral` = Mistral con MISTRAL_MODEL;
      # `openrouter` = OpenRouter con OPENROUTER_MODEL (forma organizacion/modelo)
      # y el secreto OPENROUTER_API_KEY. Cambiar de proveedor = cambiar solo MISTRAL_PROVIDER.
      model: ${{ vars.MISTRAL_PROVIDER == 'openrouter' && vars.OPENROUTER_MODEL || vars.MISTRAL_MODEL }}
      provider: ${{ vars.MISTRAL_PROVIDER }}
      openrouter_provider: ${{ vars.OPENROUTER_PROVIDER }}
      # Golden generados: se regeneran con scripts, no se revisan.
      excluded: |
        tests/golden/**
        tests/golden-seguridad/**
        tests/golden-i18n/**
    secrets:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
