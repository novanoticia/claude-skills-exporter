name: Validar plugin

# Se ejecuta en cada push y en cada pull request sobre main.
# Con el marketplace en modo autosync, un manifiesto roto llega a los usuarios
# de inmediato: esto lo detecta antes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar manifiestos, skills y comandos
        run: python3 .github/validate_plugin.py .

      - name: Instalar dependencias de validacion
        run: python3 -m pip install --quiet jsonschema

      - name: Validar perfiles de destino y su concordancia con la documentacion
        run: python3 .github/validar_perfiles.py .

      - name: Validar reglas de seguridad y su cobertura por fixtures
        run: python3 .github/validar_reglas.py .

      - name: El analisis sigue siendo estatico
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys
          # La garantia que hace seguro apuntar esta herramienta al repositorio de
          # un desconocido: no ejecuta nada de lo que analiza. El unico proceso
          # externo del programa es `git clone`. Hasta ahora eso se comprobaba a
          # mano; aqui lo comprueba el CI.
          #
          # Antes solo se miraban las llamadas cuyo `func` era un ast.Attribute,
          # es decir la forma `modulo.funcion(...)`. Eso dejaba pasar las dos
          # formas mas obvias de esquivarlo:
          #
          #     from os import system; system("...")   # llamada por ast.Name
          #     exec(codigo)                           # builtin, sin modulo
          #
          # El paso daba por tanto una garantia que no estaba dando. Ahora se
          # comprueban las tres formas en que un nombre prohibido puede llegar a
          # ejecutarse: como atributo, como nombre simple, y en el import que lo
          # trae al espacio de nombres -que ademas es lo unico que caza un
          # `from os import system as s`, donde la llamada ya no se llama igual-.
          PERMITIDO = {("subprocess", "run")}
          PROHIBIDO = {"system", "popen", "Popen", "call", "check_output",
                       "check_call", "spawnl", "spawnv", "execv", "execve",
                       "eval", "exec"}
          # De estos modulos no se importa nada a granel: un `import *` esconde
          # cualquiera de los nombres de arriba.
          MODULOS_DE_PROCESO = {"os", "subprocess", "pty", "popen2", "commands"}
          malos = []
          for p in sorted(pathlib.Path("skills/plugin-to-agentskills/scripts").rglob("*.py")):
              arbol = ast.parse(p.read_text(encoding="utf-8"))
              for n in ast.walk(arbol):
                  if isinstance(n, ast.ImportFrom):
                      for alias in n.names:
                          if alias.name in PROHIBIDO:
                              malos.append("{}:{} -> from {} import {}".format(
                                  p, n.lineno, n.module, alias.name))
                          elif alias.name == "*" and n.module in MODULOS_DE_PROCESO:
                              malos.append("{}:{} -> from {} import *".format(
                                  p, n.lineno, n.module))
                      continue
                  if not isinstance(n, ast.Call):
                      continue
                  if isinstance(n.func, ast.Attribute):
                      base = getattr(n.func.value, "id", None)
                      par = (base, n.func.attr)
                      if n.func.attr in PROHIBIDO or (base == "subprocess" and par not in PERMITIDO):
                          malos.append("{}:{} -> {}.{}".format(p, n.lineno, base, n.func.attr))
                  elif isinstance(n.func, ast.Name) and n.func.id in PROHIBIDO:
                      malos.append("{}:{} -> {}()".format(p, n.lineno, n.func.id))
          if malos:
              print("[error] llamadas a procesos externos no permitidas:", file=sys.stderr)
              [print("  " + m, file=sys.stderr) for m in malos]
              sys.exit(1)
          print("Analisis estatico: ningun proceso externo fuera de subprocess.run(git clone).")
          PY

      - name: Validar el resumen.json contra su schema
        run: |
          # --anular-revision-seguridad es deliberado: este repositorio contiene a
          # proposito su propio banco de pruebas malicioso (tests/fixtures/) y la
          # documentacion de los patrones (docs/). Esta es la prueba de humo del
          # conversor, no la del gate: el gate se prueba en tests/test_seg_gate.py.
          # --only lo es igual: en tests/fixtures/ hay ocho skills que publican
          # todas `name: fechas`, y exportarlas juntas aborta por nombre repetido.
          python3 skills/plugin-to-agentskills/scripts/convert.py . --out /tmp/salida-ci \
            --only plugin-to-agentskills --anular-revision-seguridad
          python3 - <<'PY'
          import json, jsonschema, pathlib
          esquema = json.loads(pathlib.Path(
              "skills/plugin-to-agentskills/scripts/exporter/resumen.schema.json"
          ).read_text(encoding="utf-8"))
          datos = json.loads(pathlib.Path("/tmp/salida-ci/resumen.json").read_text(encoding="utf-8"))
          jsonschema.validate(datos, esquema)
          print("resumen.json valida contra su schema.")
          PY

      - name: Pruebas unitarias
        run: python3 -m unittest discover -s tests -t tests -v

      - name: El conversor arranca desde una copia aislada
        run: |
          cp -R . /tmp/cse-aislado
          python3 /tmp/cse-aislado/skills/plugin-to-agentskills/scripts/convert.py \
            /tmp/cse-aislado --out /tmp/salida-aislada \
            --only plugin-to-agentskills --anular-revision-seguridad
          test -f /tmp/salida-aislada/INFORME-PORTABILIDAD.md
          echo "Arranca sin instalacion desde una ruta ajena al repositorio."

      - name: Prueba de humo del conversor
        run: |
          python3 skills/plugin-to-agentskills/scripts/convert.py --help
          python3 skills/plugin-to-agentskills/scripts/convert.py . --out /tmp/salida \
            --only plugin-to-agentskills --anular-revision-seguridad
          test -f /tmp/salida/INFORME-PORTABILIDAD.md
          test -n "$(ls /tmp/salida/*.zip)"
          echo "El conversor se ejecuta y produce salida."
